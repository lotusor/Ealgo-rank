# rank.eacm.cn —— 护照 nginx 薄转发 shim（独立文件，不改动 default.conf）
# 复用护照容器内已有证书：/etc/nginx/certs/fullchain.pem + privkey.pem（*.eacm.cn 通配证）
# 仅做 TLS 终结 + proxy_pass 到 rank-nginx 容器(:8003)，rank 全部逻辑在独立容器内。
#
# 落地方式：docker cp 进 lotus-passport-nginx-1 的 /etc/nginx/conf.d/rank.eacm.cn.conf
# 再 nginx -s reload。该文件活在容器的**可写层**，一旦 --force-recreate 那个容器就会消失，
# rank.eacm.cn 随之 502——重建后必须重新 cp 本文件。改完记得同步两端 md5。
#
# X-Forwarded-For 用 $remote_addr 覆盖而非追加：shim 是 rank 侧唯一的信任边界，
# 追加会把访客自带的伪造值排在首位送进 rank-nginx → rank 的按 IP 限流即可被绕。

server {
    listen 80;
    server_name rank.eacm.cn;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name rank.eacm.cn;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    client_max_body_size 20m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
