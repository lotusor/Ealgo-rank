# 宝塔站点配置：rank.eacm.cn
# 作用：托管前端静态产物 + 反代后端 API（同一域名，前端 API_BASE='/api/v1' 为相对路径）
# 由 宝塔 现有 nginx 加载（放入 /www/server/panel/vhost/nginx/ 或 宝塔 站点配置）
# SSL 由 宝塔/certbot 管理；启用后补 443 server 并 80->443 重定向。

server {
    listen 80;
    server_name rank.eacm.cn;

    # 前端构建产物（npm run build 输出），由宿主机提供
    root /www/wwwroot/rank.eacm.cn/dist;
    index index.html;

    # 后端 API —— 宿主机 8001 的 gunicorn（host 网络模式）
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态资源（Django collectstatic 输出在容器内，经 gunicorn 提供）
    location /static/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 媒体文件（后端容器 bind mount 到宿主 ./volumes/media，经 gunicorn 提供）
    location /media/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 客户端上传大小上限（校徽等）
    client_max_body_size 20m;
}
