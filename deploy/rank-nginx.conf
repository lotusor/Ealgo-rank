# rank-nginx 独立容器配置（纯 HTTP，只监听 host 回环 127.0.0.1:8003）
# TLS 已在外部反代(443) 终结，并带 X-Forwarded-Proto:https 反代进来。

# 导出赛情下载限速：单 IP 60 次/分钟（burst 10）。
# 只挂在下方的 internal location 上，不影响 /api/ 与静态资源。
limit_req_zone $binary_remote_addr zone=export_dl:1m rate=60r/m;

# 兜底 vhost：8003 只接受来自外层反代的请求。
# 直连 IP:8003 或伪造 Host 一律断连，避免绕过外层 TLS 终结与响应头。
server {
    listen 127.0.0.1:8003 default_server;
    server_name _;
    return 444;
}

server {
    listen 127.0.0.1:8003;
    server_name localhost;

    client_max_body_size 20m;

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 前端 SPA 产物（由编排挂载到 /usr/share/nginx/html）
    root /usr/share/nginx/html;
    index index.html;

    # 导出赛情文件（bind mount：./volumes/exports）
    # internal = 只有后端返回的 X-Accel-Redirect 能命中；外部直连一律 404，
    # 避免知道了 job 文件名就绕过 Authorization 直接拉走含学号的表格。
    # 刻意不在这里 add_header Content-Disposition：该头由 Django 下发，
    # 这里再声明一次会产生两个同名头，浏览器行为不一致。
    location /_files/exports/ {
        internal;
        alias /var/www/exports/;
        limit_req zone=export_dl burst=10 nodelay;
        sendfile on;
    }

    # 管理员申请证明材料：强制下载，禁止在站内域内联执行（防存储型 XSS）
    location /media/admin_apply/ {
        alias /var/www/media/admin_apply/;
        expires 30d;
        add_header Cache-Control "public";
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 媒体文件（bind mount：./volumes/media）
    location /media/ {
        alias /var/www/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # API 与后端动态请求
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    # 静态资源（后端经 whitenoise 由 /static/ 提供）
    location /static/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # SPA 前端路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 部署残留/回滚点不可下载（与门户同一道护栏）
    location ~* \.(?:bak|bak-.+|orig|save|swp|env|old|~)$ {
        return 404;
    }
}
