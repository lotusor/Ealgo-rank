# rank-nginx 独立容器配置（纯 HTTP，监听 host :8003）
# TLS 已在护照 nginx(443) 终结，并带 X-Forwarded-Proto:https 反代进来。
server {
    listen 8003;
    server_name rank.eacm.cn;

    client_max_body_size 20m;

    # 前端 SPA 产物（bind mount：/www/wwwroot/rank.eacm.cn/dist）
    root /usr/share/nginx/html;
    index index.html;

    # 媒体文件（bind mount：./volumes/media）
    location /media/ {
        alias /var/www/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # API 与后端动态请求
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    # 静态资源（后端经 whitenoise 由 /static/ 提供）
    location /static/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # SPA 前端路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
