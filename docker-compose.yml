# E-algo-rank 后端编排
# 设计要点（依用户决策 2026-08-16）：
#   - Docker 容器化，但 PG / Redis 复用 宝塔 内置实例（Redis 用 :6379 + 独立 db 索引，不动护照数据）
#   - 容器用 host 网络模式：直接访问宿主 127.0.0.1 的 PG/Redis 与 gunicorn:8001
#   - TLS 由护照 nginx 在 443 终结（复用 *.eacm.cn 通配证），薄转发到本编排的 rank-nginx(:8003)
#   - rank-nginx 独立容器：承载前端 SPA(dist) + /api//static//media/ 反代到 backend:8001
#   - 媒体文件用宿主机 bind mount 持久化（./volumes/media）
#   - 爬虫落盘缓存持久化（./volumes/crawler-data -> /app/crawlers/data），容器重建不丢

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    network_mode: "host"
    env_file:
      - .env.prod
    environment:
      DJANGO_ENV: prod
    volumes:
      - ./volumes/media:/app/backend/media
      - ./volumes/crawler-data:/app/crawlers/data
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    network_mode: "host"
    command: celery -A config worker -Q crawl,crawl_slow -l info
    env_file:
      - .env.prod
    environment:
      DJANGO_ENV: prod
    volumes:
      - ./volumes/media:/app/backend/media
      - ./volumes/crawler-data:/app/crawlers/data
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
    network_mode: "host"
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env.prod
    environment:
      DJANGO_ENV: prod
    restart: unless-stopped

  # 独立 nginx 容器：前端 SPA + 反代到 backend(:8001)。纯 HTTP，TLS 已在护照 nginx 终结。
  # host 网络 :8003，由护照 nginx 443 薄转发到此处。
  rank-nginx:
    image: nginx:1.27-alpine
    network_mode: "host"
    volumes:
      - ./deploy/rank-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /www/wwwroot/rank.eacm.cn/dist:/usr/share/nginx/html:ro
      - ./volumes/media:/var/www/media:ro
    depends_on:
      - backend
    restart: unless-stopped
